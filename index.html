<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocol: Birthday Quest ❤️</title>

  <!-- Google Fonts & Canvas Confetti CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Linked CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    
    <!-- 1. WELCOME / PASSWORD SCREEN -->
    <div id="screen-welcome" class="screen active">
      <div class="badge-bar">
        <span class="badge">🔒 AUTH_REQUIRED</span>
      </div>
      <h1>Access Protocol: Birthday Edition ❤️</h1>
      <p class="subtitle">A secure verification test has been initialized. Enter your custom security passkey to unlock the quest.</p>
      
      <form id="password-form">
        <div class="input-group">
          <input type="password" id="passkey-input" placeholder="Enter passkey here..." autocomplete="off" />
          <button type="submit" class="btn">Unlock Quest 🚀</button>
        </div>
      </form>
      <p class="feedback-msg" id="auth-feedback"></p>
    </div>

    <!-- 2. 10-QUESTION QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
      <div class="badge-bar">
        <span class="badge" id="quiz-level-badge">LEVEL 1 OF 10</span>
        <span class="difficulty-tag diff-easy" id="quiz-diff-tag">EASY</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>

      <h2 class="question-title" id="question-text">Loading question...</h2>

      <!-- Multiple choice container (Questions 1-7) -->
      <div class="options-grid" id="options-container"></div>

      <!-- Identification input container (Questions 8-10) -->
      <div id="ident-container" style="display: none; margin-top: 1rem;">
        <form id="ident-form">
          <div class="input-group">
            <input type="text" id="ident-input" placeholder="Type your answer..." autocomplete="off" />
            <button type="submit" class="btn">Submit Answer ✨</button>
          </div>
        </form>
        <span class="hint-toggle" id="hint-toggle-btn">Need a hint? 💡</span>
        <div class="hint-box" id="hint-box"></div>
      </div>

      <p class="feedback-msg" id="quiz-feedback"></p>
    </div>

    <!-- 3. GRAND PRIZE / LETTER SCREEN -->
    <div id="screen-prize" class="screen" style="text-align: center;">
      <div class="badge-bar" style="justify-content: center;">
        <span class="badge badge-success">
          🔓 ACCESS GRANTED: SYSTEM DECRYPTED
        </span>
      </div>
      <h1 class="prize-heading">Happy Birthday, Love! 🎂</h1>
      
      <div class="terminal-box">
        <div class="terminal-header">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="terminal-file-tag">decrypted_letter.txt</span>
        </div>
        <span id="typed-message"></span><span class="cursor" id="cursor"></span>
      </div>

      <div class="action-row">
        <button class="btn btn-secondary" id="copy-btn">📋 Copy Letter</button>
        <button class="btn" id="restart-btn">🔄 Replay Quiz</button>
      </div>
      <p class="feedback-msg" id="prize-feedback" style="min-height: 1rem;"></p>
    </div>

  </div>

  <!-- Linked JS -->
  <script src="script.js"></script>
</body>
</html>
